<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnlyGames</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    a {
      color: inherit;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(15, 23, 42, 0.96);
      border-bottom: 1px solid #334155;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #93c5fd;
      text-decoration: none;
    }

    .search {
      width: min(420px, 100%);
      padding: 11px 14px;
      border: 1px solid #475569;
      border-radius: 12px;
      background: #1e293b;
      color: #f8fafc;
      outline: none;
    }

    .search:focus {
      border-color: #60a5fa;
    }

    .hero {
      padding: 42px 20px 18px;
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 52px);
    }

    .hero p {
      margin: 0;
      color: #cbd5e1;
      font-size: 18px;
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
      padding: 28px 20px 42px;
      max-width: 1180px;
      margin: 0 auto;
    }

    .card {
      overflow: hidden;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
    }

    .cover {
      display: grid;
      place-items: center;
      height: 130px;
      font-size: 42px;
      font-weight: 900;
      color: #dbeafe;
      background: linear-gradient(135deg, #2563eb, #9333ea);
    }

    .content {
      padding: 16px;
    }

    .content h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .meta {
      margin: 0 0 10px;
      color: #94a3b8;
      font-size: 14px;
    }

    .desc {
      margin: 0 0 14px;
      color: #cbd5e1;
      line-height: 1.45;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tag {
      padding: 5px 9px;
      border-radius: 999px;
      background: #334155;
      color: #e2e8f0;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .button {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .button.primary {
      background: #2563eb;
      color: white;
    }

    .button.primary:hover {
      background: #1d4ed8;
    }

    .button.secondary {
      background: transparent;
      border-color: #64748b;
      color: #cbd5e1;
    }

    .button.secondary:hover {
      background: #334155;
    }

    .empty {
      max-width: 680px;
      margin: 0 auto 40px;
      padding: 0 20px;
      color: #94a3b8;
      text-align: center;
    }

    footer {
      padding: 22px 20px;
      color: #94a3b8;
      text-align: center;
      border-top: 1px solid #334155;
    }

    @media (max-width: 560px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .logo {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#">GameVault</a>
    <input id="searchInput" class="search" type="search" placeholder="Search games..." aria-label="Search games" />
  </header>

  <main>
    <section class="hero">
      <h1>Find your next game</h1>
      <p>Demo catalog. Download buttons redirect to the original website.</p>
    </section>

    <section id="catalog" class="catalog" aria-live="polite"></section>
    <p id="emptyState" class="empty" hidden>No games found. Try another search.</p>
  </main>

  <footer>
    Built on GitHub Pages. Only use legal, official, free, or authorized game links.
  </footer>

  <script>
    const games = [
      {
        title: "Example Game One",
        source: "example.com",
        sourceUrl: "https://example.com/game/example-game-one",
        downloadUrl: "https://example.com/download/example-game-one",
        tags: ["free", "demo", "action"],
        version: "1.0",
        updated: "2026-11-02",
        description: "This is demo data. Replace it with real games later."
      },
      {
        title: "Example Game Two",
        source: "example.com",
        sourceUrl: "https://example.com/game/example-game-two",
        downloadUrl: "https://example.com/download/example-game-two",
        tags: ["free", "demo", "puzzle"],
        version: "2.1",
        updated: "2026-11-02",
        description: "Search works on title, source website, and tags."
      }
    ];

    const catalog = document.getElementById("catalog");
    const searchInput = document.getElementById("searchInput");
    const emptyState = document.getElementById("emptyState");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function firstLetter(title) {
      return escapeHtml((title || "?").trim().charAt(0).toUpperCase() || "?");
    }

    function tagHtml(tags) {
      return (tags || [])
        .map(tag => `<span class="tag">${escapeHtml(tag)}</span>`)
        .join("");
    }

    function cardHtml(game) {
      return `
        <article class="card">
          <div class="cover">${firstLetter(game.title)}</div>
          <div class="content">
            <h2>${escapeHtml(game.title)}</h2>
            <p class="meta">
              ${escapeHtml(game.source)} · v${escapeHtml(game.version)} · ${escapeHtml(game.updated)}
            </p>
            <p class="desc">${escapeHtml(game.description)}</p>
            <div class="tags">${tagHtml(game.tags)}</div>
            <div class="actions">
              <a
                class="button secondary"
                href="${escapeHtml(game.sourceUrl)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Game page
              </a>
              <a
                class="button primary"
                href="${escapeHtml(game.downloadUrl)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Download
              </a>
            </div>
          </div>
        </article>
      `;
    }

    function renderGames(list) {
      catalog.innerHTML = list.map(cardHtml).join("");
      emptyState.hidden = list.length > 0;
    }

    searchInput.addEventListener("input", () => {
      const query = searchInput.value.toLowerCase().trim();

      const filtered = games.filter(game => {
        const searchable = [
          game.title,
          game.source,
          game.description,
          ...(game.tags || [])
        ].join(" ").toLowerCase();

        return searchable.includes(query);
      });

      renderGames(filtered);
    });

    renderGames(games);
  </script>
</body>
</html>
